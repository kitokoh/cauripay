name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript : lint + typecheck + build + tests (GOURSI-005a)
  # ---------------------------------------------------------------------------
  ts:
    name: TS — lint / typecheck / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests (jest)
        run: npm test

  # ---------------------------------------------------------------------------
  # Java (ledger-service) : mvn test + checkstyle + spotbugs (GOURSI-005a)
  # Le job ne s'exécute que si le ledger est touché (le service arrive en G1).
  # ---------------------------------------------------------------------------
  java:
    name: Java — mvn test (ledger)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(join(github.event.pull_request.changed_files, ','), 'services/ledger')
    defaults:
      run:
        working-directory: services/ledger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Tests unitaires + Checkstyle + SpotBugs
        run: mvn -B -ntp verify

      - name: Tests d'intégration (Testcontainers, Docker)
        run: mvn -B -ntp verify -Pit
