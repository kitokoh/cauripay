name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Typecheck (tsc --noEmit strict)
        run: npm run typecheck
      - name: Garde-fou .env (aucun secret committé)
        run: |
          if grep -rE "(sk_live|sk_test|AKIA|ghp_|-----BEGIN.*PRIVATE KEY)" --include="*.env*" . 2>/dev/null; then
            echo "::error::Secret détecté dans un fichier .env committé"; exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests Jest (tous les workspaces TS)
        run: npm run test

  test-java:
    name: Tests Java (mvn — ledger-service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Détection pom.xml (ledger-service)
        id: pom
        run: |
          if [ -f services/ledger-service/pom.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Maven test
        if: steps.pom.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Maven verify — tests + Checkstyle + SpotBugs + package
        if: steps.pom.outputs.exists == 'true'
        working-directory: services/ledger-service
        run: mvn -B -ntp verify

      - name: Tests d'intégration (Testcontainers — Postgres 16 + Redis 7)
        if: steps.pom.outputs.exists == 'true'
        working-directory: services/ledger-service
        run: mvn -B -ntp verify -Pit

  legacy:
    name: Tests legacy v0.1 (archivé)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install + tests legacy/server
        working-directory: legacy/server
        run: |
          npm ci --no-audit --no-fund
          npm test
