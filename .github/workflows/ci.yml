name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Typecheck (tsc --noEmit strict)
        run: npm run typecheck
      - name: Garde-fou .env (aucun secret committé)
        run: |
          if grep -rE "(sk_live|sk_test|AKIA|ghp_|-----BEGIN.*PRIVATE KEY)" --include="*.env*" . 2>/dev/null; then
            echo "::error::Secret détecté dans un fichier .env committé"; exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests Jest (tous les workspaces TS)
        run: npm run test

  test-java:
    name: Tests Java (mvn — ledger-service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: hashFiles('services/ledger-service/pom.xml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Maven test
        working-directory: services/ledger-service
        run: mvn -B -q test

  legacy:
    name: Tests legacy v0.1 (archivé)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install + tests legacy/server
        working-directory: legacy/server
        run: |
          npm ci --no-audit --no-fund
          npm test
