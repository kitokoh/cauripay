name: Deploy Staging

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kitokoh/cauripay
  TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}

jobs:
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.nestjs
          build-args: WORKSPACE=services/api-core
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api-core:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push ledger-service
        uses: docker/build-push-action@v6
        with:
          context: services/ledger-service
          file: infra/docker/Dockerfile.java
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/ledger-service:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Migrations (Flyway + Prisma)
        run: |
          cd services/ledger-service && mvn -B flyway:migrate \
            -Dflyway.url="${{ secrets.LEDGER_DATABASE_URL_STAGING }}" \
            -Dflyway.user="${{ secrets.POSTGRES_USER_STAGING }}" \
            -Dflyway.password="${{ secrets.POSTGRES_PASSWORD_STAGING }}"
      - name: Déployer compose staging
        run: |
          docker compose -f docker-compose.yml -f infra/compose/staging.yml up -d
        env:
          TAG: latest
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          LEDGER_DATABASE_URL: ${{ secrets.LEDGER_DATABASE_URL_STAGING }}
          REDIS_URL: ${{ secrets.REDIS_URL_STAGING }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL_STAGING }}
          KEYCLOAK_JWKS_URL: ${{ secrets.KEYCLOAK_JWKS_URL_STAGING }}
          KEYCLOAK_ISSUER: ${{ secrets.KEYCLOAK_ISSUER_STAGING }}
          INTERNAL_SERVICE_KEY_STAGING: ${{ secrets.INTERNAL_SERVICE_KEY_STAGING }}
          CORS_ORIGINS_STAGING: ${{ secrets.CORS_ORIGINS_STAGING }}
          POSTGRES_USER_STAGING: ${{ secrets.POSTGRES_USER_STAGING }}
          POSTGRES_PASSWORD_STAGING: ${{ secrets.POSTGRES_PASSWORD_STAGING }}
