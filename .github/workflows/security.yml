name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # chaque lundi 06:00 UTC

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gitleaks : fuite de secrets dans le dépôt (GOURSI-005b)
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # optionnel (gratuit pour open source)

  # ---------------------------------------------------------------------------
  # Trivy : vulnérabilités des dépendances / fs (GOURSI-005b)
  # Échec si CRITICAL ou HIGH.
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy (vulnérabilités)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan filesystem
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
