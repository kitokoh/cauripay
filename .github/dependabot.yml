# 📦 Dépendances — mises à jour automatiques (npm + GitHub Actions)
# Chaque PR passe par la CI obligatoire avant merge.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["tech-debt", "DX"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["area:infra"]
    commit-message:
      prefix: "chore(ci)"
