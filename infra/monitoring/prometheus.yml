# GOURSI — Prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ledger-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ledger-service:3010']
  - job_name: 'api-core'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-core:3000']
  - job_name: 'business-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['business-service:3020']
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
