# Staging — Docker Compose (déploiement CI)

# Usage : docker compose -f docker-compose.yml -f infra/compose/staging.yml up -d
# Ne contient AUCUN secret — les variables viennent de l'environnement (GitHub Secrets).

name: cauripay-staging

services:
  api-core:
    image: ghcr.io/kitokoh/cauripay/api-core:${TAG:-latest}
    environment:
      NODE_ENV: staging
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY_STAGING}
      CORS_ORIGINS: ${CORS_ORIGINS_STAGING}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cauripay-net

  ledger-service:
    image: ghcr.io/kitokoh/cauripay/ledger-service:${TAG:-latest}
    environment:
      LEDGER_DATABASE_URL: ${LEDGER_DATABASE_URL}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY_STAGING}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cauripay-net
