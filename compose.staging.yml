# =============================================================================
# CauriPay — docker-compose staging (GOURSI-005c)
# Utilise les images GHCR (cauripay/<service>:<TAG>) poussées par la CI staging.
# Migrations exécutées par scripts/deploy-staging.sh avant le `up`.
# Usage : docker compose --env-file .env -f compose.staging.yml up -d
# =============================================================================

name: cauripay-staging

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cauripay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cauripay_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cauripay}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cauripay}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-cauripay_dev_password}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cauripay_dev_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cauripay}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cauripay_dev_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-cauripay}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-cauripay_dev_password}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_PROXY: edge
    volumes:
      - ./infra/keycloak/realm-goursi.json:/opt/keycloak/data/import/realm-goursi.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

  # --- Services applicatifs (images GHCR poussées par la CI) -----------------
  ledger:
    image: ghcr.io/kitokoh/cauripay/ledger:${TAG:-latest}
    environment:
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/cauripay
      LEDGER_REDIS_URL: redis://:${REDIS_PASSWORD:-cauripay_dev_password}@redis:6379/0
      LEDGER_RABBITMQ_URL: amqp://${RABBITMQ_USER:-cauripay}:${RABBITMQ_PASSWORD:-cauripay_dev_password}@rabbitmq:5672
      LEDGER_SERVICE_KEY: ${LEDGER_SERVICE_KEY}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-staging}
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-core:
    image: ghcr.io/kitokoh/cauripay/api-core:${TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cauripay}:${POSTGRES_PASSWORD:-cauripay_dev_password}@postgres:5432/cauripay
      LEDGER_BASE_URL: http://ledger:8100
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-goursi}/protocol/openid-connect/certs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ledger:
        condition: service_started

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
