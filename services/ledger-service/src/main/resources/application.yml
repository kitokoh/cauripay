# =============================================================================
# ledger-service — configuration Spring Boot 3.2 (GOURSI-010a)
# Toutes les valeurs sensibles passent par l'environnement (.env / secrets).
# Port de convention : 3010 (REVUE-CONSTITUTION §2, ADR-004).
# =============================================================================
server:
  port: ${LEDGER_PORT:3010}
  shutdown: graceful

spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DATABASE_URL:jdbc:postgresql://localhost:5432/goursi_ledger}
    username: ${POSTGRES_USER:goursi}
    password: ${POSTGRES_PASSWORD:goursi_dev_password}
  jpa:
    # Le schéma est créé UNIQUEMENT par Flyway ; Hibernate valide l'alignement.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    # La table d'historique Flyway vit dans public ; les migrations créent le schéma `ledger`.
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
  rabbitmq:
    url: ${RABBITMQ_URL:amqp://localhost:5672}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
  jackson:
    default-property-inclusion: non_null

ledger:
  # Clé inter-services (X-Service-Key) — OBLIGATOIRE, aucun défaut en dur.
  # Refus de démarrer si absente (fail-fast, voir ServiceKeyFilter).
  service-key: ${INTERNAL_SERVICE_KEY:}
  idempotency:
    ttl-hours: ${LEDGER_IDEMPOTENCY_TTL_HOURS:24}
    claim-ttl-seconds: 30
  checkpoint:
    cron: ${LEDGER_CHECKPOINT_CRON:0 0 2 * * *}
  events:
    exchange: financial.events

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ledger-service
