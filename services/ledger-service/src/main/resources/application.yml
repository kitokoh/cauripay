server:
  port: ${LEDGER_PORT:3010}

spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DATABASE_URL:jdbc:postgresql://localhost:5432/goursi}
    username: ${POSTGRES_USER:goursi}
    password: ${POSTGRES_PASSWORD:goursi}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ledger
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    schemas: ledger
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

goursi:
  ledger:
    idempotency-ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}
    checkpoint-cron: ${CHECKPOINT_CRON:0 0 2 * * *}
  internal:
    service-key: ${GOURSI_SERVICE_KEY:dev-service-key-change-me}

logging:
  level:
    com.goursi: INFO
