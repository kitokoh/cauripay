spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DATABASE_URL}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate   # le DDL appartient à Flyway — jamais de update
    properties:
      hibernate:
        default_schema: ledger
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    schemas: ledger
    default-schema: ledger
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      url: ${REDIS_URL:}
  rabbitmq:
    addresses: ${RABBITMQ_URL}

server:
  port: ${LEDGER_PORT:3010}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

goursi:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY}
  ledger:
    idempotency-ttl-hours: ${LEDGER_IDEMPOTENCY_TTL_HOURS:24}
    checkpoint-cron: ${LEDGER_CHECKPOINT_CRON:0 0 2 * * *}
    exchange: financial.events
    dlq-exchange: dead.letters

logging:
  level:
    com.goursi.ledger: INFO
    org.hibernate.SQL: WARN
