# Profil de test (Testcontainers)
# Le datasource est surchargé par @DynamicPropertySource dans les tests.

goursi:
  internal:
    service-key: test-secret-key
  ledger:
    idempotency-ttl-hours: 1
    checkpoint-cron: "0 0 2 * * *"

spring:
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
