# GOURSI-QA3 — OWASP ZAP baseline sur api-core
# DoD #10 : 0 vulnérabilité critique (CVSS > 9) au pentest automatisé.
# Usage : exécuté par CI (security-scan.yml) sur l'environnement staging.
# Local : docker run --rm -t ghcr.io/zaproxy/zaproxy zap-baseline.py ...

# Cibles (hosts hors périmètre = faux positifs connus)
excluded_uris:
  - https://staging.goursi.app/api/v1/auth/login
  - https://staging.goursi.app/health

# Règles : tout ce qui est HIGH/CRITICAL fait échouer le scan (DoD #10)
fail_on:
  - HIGH
  - CRITICAL
